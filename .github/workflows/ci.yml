name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: se7e_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/se7e_mcp_test
      MCP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PLUG_SERVER_BASE_URL: http://plug-server.test
      GIT_SHA: ${{ github.sha }}
      PLUG_SERVER_ROOT: ${{ github.workspace }}/plug_server_contract
    steps:
      - uses: actions/checkout@v4
      - name: Checkout plug_server contract
        uses: actions/checkout@v4
        with:
          repository: cesar-carlos/plug_server
          path: plug_server_contract
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Install plug_server contract dependencies
        run: npm ci
        working-directory: plug_server_contract
      - name: Check plug_server contract and compatibility baseline
        run: npm run contract:check
        working-directory: plug_server_contract
      - run: npm run test:migrations
        env:
          CI: "true"
          NODE_ENV: test
      - run: npm run db:migrate
      - name: Release gate
        run: npm run release:check
