name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: production-mcp
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - id: gate
        name: Decide se há alteração de runtime
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git show --pretty=format: --name-only "$SHA" > "$RUNNER_TEMP/changed-files"
          if bash scripts/should-publish-production.sh < "$RUNNER_TEMP/changed-files"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar aceite da refatoração persona-v2
        if: steps.gate.outputs.publish == 'true'
        env:
          PERSONA_V2_RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/check-persona-release.mjs

      - id: accepted-image
        name: Validate accepted artifact origin
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/accepted-image-origin.mjs
      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.publish == 'true'
        with:
          artifact-ids: ${{ steps.accepted-image.outputs.artifact_id }}
          path: ${{ runner.temp }}/tested-image/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.accepted-image.outputs.run_id }}
          digest-mismatch: error

      - id: deploy
        name: Publish the CI image
        if: success() && steps.gate.outputs.publish == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          PERSONA_V2_RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):${SHA}"
          export PERSONA_V2_IMAGE_REVISION="${{ steps.accepted-image.outputs.image_revision }}"
          node scripts/tested-image.mjs verify "$RUNNER_TEMP/tested-image"
          docker load --input "$RUNNER_TEMP/tested-image/image.tar"
          node scripts/tested-image.mjs verify-loaded "$RUNNER_TEMP/tested-image" se7e-native
          node scripts/check-persona-release.mjs --image-proof "$RUNNER_TEMP/tested-image/image-proof.json"
          docker tag se7e-native "$image"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          docker save "$image" | ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "deploy ${SHA}"

      - name: Report production status
        if: always()
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ steps.gate.outputs.publish }}
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "false" ]; then
            state=success
            desc="Sem alteração de runtime"
          elif [ "$OUTCOME" = "success" ]; then
            state=success
            desc="Container MCP publicado"
          else
            state=failure
            desc="Publicação do MCP falhou"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$state" \
            -f context="production/mcp" \
            -f description="$desc" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
