# Explicit opt-in overlay for the dedicated test destination. No database/hub environment on renderer.
services:
  server:
    environment:
      PERSONA_V2_PDF_ENABLED: "true"
    volumes:
      - persona_pdf_socket:/run/se7e-pdf
    depends_on:
      pdf-renderer:
        condition: service_healthy
  pdf-renderer:
    image: ${PERSONA_V2_TEST_IMAGE:?Explicit verified Docker image ID required}
    entrypoint: [node, dist/pdf-renderer-main.js]
    init: true
    network_mode: none
    read_only: true
    restart: "no"
    mem_limit: 384m
    cpus: 1
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    volumes:
      - persona_pdf_socket:/run/se7e-pdf
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const s=require('node:net').connect('/run/se7e-pdf/renderer.sock');s.on('connect',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
volumes:
  persona_pdf_socket:
